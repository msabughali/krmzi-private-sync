services:
  web:
    build:
      context: .
    restart: unless-stopped
    # Coolify injects env vars from the dashboard at runtime.
    # `env_file` is only used when running `docker compose up` locally.
    env_file:
      - path: .env
        required: false
    environment:
      WEB_PORT: 8787
      # krmzy.com currently 30x-redirects datacenter IPs to a "Coming Soon"
      # placeholder on krmzi.tv; krmzi.onl is the live primary host.
      SOURCE_BASE_URL: https://krmzi.onl
      MAX_EPISODES_PER_RUN: 1000
      MAX_LIST_PAGES: 80
      EPISODES_FILE_PATH: /app/data/episodes.json
      SERIES_FILE_PATH: /app/data/series.json
      STATE_FILE_PATH: /app/data/state.json
      # auto: overwrite the volume on image rebuild (new bundled seed
      # snapshot), keep user data otherwise. Set to `force` to always
      # overwrite, or `missing` to only fill empty files.
      SEED_DATA_MODE: auto
    expose:
      - "8787"
    volumes:
      - krmzi-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: ["node", "src/webServer.js"]

  worker:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SOURCE_BASE_URL: https://krmzi.onl
      MAX_EPISODES_PER_RUN: 1000
      MAX_LIST_PAGES: 80
      EPISODES_FILE_PATH: /app/data/episodes.json
      SERIES_FILE_PATH: /app/data/series.json
      STATE_FILE_PATH: /app/data/state.json
      SEED_DATA_MODE: auto
    volumes:
      - krmzi-data:/app/data
    depends_on:
      web:
        condition: service_started
    command: ["node", "src/index.js", "--loop"]

volumes:
  krmzi-data:
