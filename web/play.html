<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قرمزي — مشغّل الحلقة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="brand">
      <div class="container">
        <div class="brand-inner">
          <h1 class="brand-title">
            <span class="brand-mark">قرمزي</span>
            <span class="brand-sub">مسلسلات تركية</span>
          </h1>
          <a class="brand-back" href="/">عودة للقائمة</a>
        </div>
      </div>
    </header>
    <main class="container">
      <h2 id="title" class="player-title">مشغّل الحلقة</h2>
      <p id="meta" class="player-meta"></p>
      <p id="playerHint" class="hint">اختر سيرفر لفتح الحلقة في نافذة جديدة.</p>
      <div id="providers" class="providers"></div>
      <section id="episodeChain" class="episode-chain" hidden>
        <h3 class="episode-chain-title">الحلقات</h3>
        <div id="episodeChainList" class="episode-chain-list"></div>
      </section>
      <figure id="posterWrap" class="poster-wrap" hidden>
        <img
          id="poster"
          class="poster-img"
          alt=""
          referrerpolicy="no-referrer-when-downgrade"
        />
      </figure>
    </main>
    <script>
      const qp = new URLSearchParams(window.location.search);
      const initialPlayerUrl = qp.get("url");
      const initialEpisodeUrl = qp.get("episodeUrl");
      const initialTitle = qp.get("title") || "مشغّل الحلقة";
      const initialProvider = qp.get("provider") || "unknown";
      const imageUrlFromQuery = qp.get("imageUrl") || "";
      const titleEl = document.getElementById("title");
      const metaEl = document.getElementById("meta");
      const providersWrap = document.getElementById("providers");
      const playerHint = document.getElementById("playerHint");
      const posterWrap = document.getElementById("posterWrap");
      const posterImg = document.getElementById("poster");
      const episodeChain = document.getElementById("episodeChain");
      const episodeChainList = document.getElementById("episodeChainList");

      let currentEpisode = {
        title: initialTitle,
        episodeUrl: initialEpisodeUrl,
        playerUrl: initialPlayerUrl,
        playerProvider: initialProvider,
        imageUrl: imageUrlFromQuery
      };

      function openPlayer(url) {
        if (!url) return;
        // Keep behavior consistent across desktop and mobile during testing.
        window.location.href = url;
      }

      function isAllowedServerName(name) {
        const n = String(name || "").toLowerCase();
        return n === "dailymotion" || n === "ok";
      }

      function episodeUrlKey(value) {
        try {
          const u = new URL(value);
          let pathname = u.pathname;
          try {
            pathname = decodeURIComponent(pathname);
          } catch {
            // Keep browser-normalized path when decoding fails.
          }
          return `${u.origin.toLowerCase()}${pathname.replace(/\/+$/, "")}${u.search}`;
        } catch {
          return String(value || "");
        }
      }

      function episodeTitle(ep) {
        return ep?.title || ep?.slug?.replace(/-/g, " ") || ep?.episodeUrl || "مشغّل الحلقة";
      }

      function updateHeader() {
        const title = episodeTitle(currentEpisode);
        const provider = currentEpisode.playerProvider || "unknown";
        titleEl.textContent = title;
        metaEl.textContent = `المزود: ${provider}`;
        document.title = `${title} — قرمزي`;
      }

      function showPoster(url, title) {
        posterWrap.hidden = true;
        posterImg.removeAttribute("src");
        if (!url) return;
        posterImg.onerror = () => {
          posterWrap.hidden = true;
        };
        posterImg.src = url;
        posterImg.alt = title || "";
        posterWrap.hidden = false;
      }

      function findEpisodeWithChain(list, targetUrl) {
        const targetKey = episodeUrlKey(targetUrl);
        for (const ep of list) {
          if (!ep) continue;
          const chain = Array.isArray(ep.seriesEpisodes) ? ep.seriesEpisodes : [];
          const nested = chain.find((item) => episodeUrlKey(item?.episodeUrl) === targetKey);
          if (nested) return { episode: nested, chain };
          if (episodeUrlKey(ep.episodeUrl) === targetKey) {
            return { episode: ep, chain: chain.length ? chain : [ep] };
          }
        }
        return { episode: null, chain: [] };
      }

      function setCurrentEpisode(ep, options = {}) {
        if (!ep) return;
        currentEpisode = {
          ...currentEpisode,
          ...ep,
          title: episodeTitle(ep),
          playerUrl: ep.playerUrl || ep.videoUrl || null,
          playerId: ep.playerId || ep.videoId || null
        };
        updateHeader();
        showPoster(currentEpisode.imageUrl, currentEpisode.title);
        renderProviders();

        if (options.pushState !== false && currentEpisode.episodeUrl) {
          const next = new URL(window.location.href);
          next.searchParams.set("episodeUrl", currentEpisode.episodeUrl);
          next.searchParams.set("title", currentEpisode.title);
          next.searchParams.set("provider", currentEpisode.playerProvider || "unknown");
          next.searchParams.set("url", currentEpisode.playerUrl || "");
          next.searchParams.set("imageUrl", currentEpisode.imageUrl || "");
          window.history.pushState({}, "", next);
        }
      }

      function buildResolveUrl(serverName) {
        const base = "/api/resolve-server";
        const key = currentEpisode.episodeUrl
          ? `episodeUrl=${encodeURIComponent(currentEpisode.episodeUrl)}`
          : `playerUrl=${encodeURIComponent(currentEpisode.playerUrl || "")}`;
        const server = serverName ? `&server=${encodeURIComponent(serverName)}` : "";
        return `${base}?${key}${server}&preferDirect=1`;
      }

      function buildServerCandidates(server) {
        const id = server?.id || "";
        const name = String(server?.name || "").toLowerCase();
        if (!id) return [];
        if (/^https?:\/\//i.test(id)) return [id];
        if (name === "dailymotion") {
          return [
            `https://www.dailymotion.com/video/${id}`,
            `https://www.dailymotion.com/embed/video/${id}`
          ];
        }
        if (name === "ok") {
          return [
            `https://m.ok.ru/video/${id}`,
            `https://ok.ru/videoembed/${id}`,
            `https://ok.ru/video/${id}`
          ];
        }
        return [];
      }

      function renderProviderButtons(servers, resolver) {
        providersWrap.innerHTML = "";
        const row = document.createElement("div");
        row.className = "providers-row";
        providersWrap.appendChild(row);

        for (const srv of servers) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "provider-btn";
          btn.textContent = String(srv.name || "unknown");
          btn.onclick = async () => {
            btn.disabled = true;
            const prevLabel = btn.textContent;
            btn.textContent = "جاري الفتح…";
            try {
              const best = await resolver(srv);
              if (best) openPlayer(best);
            } finally {
              btn.disabled = false;
              btn.textContent = prevLabel;
            }
          };
          row.appendChild(btn);
        }
      }

      async function renderProviders() {
        if (!currentEpisode.playerUrl && !currentEpisode.episodeUrl) return;
        if (playerHint) {
          playerHint.textContent = "يفتح السيرفر في نفس الصفحة على جميع الأجهزة (وضع اختبار).";
        }
        providersWrap.innerHTML = "";

        const storedServers = Array.isArray(currentEpisode.playerServers)
          ? currentEpisode.playerServers.filter((s) => isAllowedServerName(s?.name))
          : [];
        if (storedServers.length > 0) {
          renderProviderButtons(storedServers, async (srv) => buildServerCandidates(srv)[0] || null);
          return;
        }

        try {
          const res = await fetch(buildResolveUrl(""));
          const payload = await res.json();
          const servers = Array.isArray(payload.servers)
            ? payload.servers.filter((s) => isAllowedServerName(s?.name))
            : [];

          if (!servers.length) {
            if (playerHint) {
              playerHint.textContent = "المتاح فقط: Dailymotion و OK. لا توجد سيرفرات مدعومة لهذه الحلقة.";
            }
            return;
          }

          renderProviderButtons(servers, async (srv) => {
            const r = await fetch(buildResolveUrl(srv.name || srv.id || ""));
            const j = await r.json();
            return (j.candidates || [])[0] || null;
          });
        } catch {
          if (playerHint) {
            playerHint.textContent = "تعذّر تحميل قائمة السيرفرات.";
          }
        }
      }

      function renderEpisodeChain(chain) {
        const items = Array.isArray(chain) ? chain : [];
        if (!items.length) {
          episodeChain.hidden = true;
          episodeChainList.innerHTML = "";
          return;
        }

        episodeChain.hidden = false;
        episodeChainList.innerHTML = "";
        const activeKey = episodeUrlKey(currentEpisode.episodeUrl);

        for (const ep of items) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "episode-chain-btn";
          if (episodeUrlKey(ep.episodeUrl) === activeKey) {
            btn.classList.add("episode-chain-btn--active");
            btn.setAttribute("aria-current", "true");
          }
          const number = ep.episodeNumber ?? "";
          btn.textContent = number ? `حلقة ${number}` : episodeTitle(ep);
          btn.onclick = () => {
            setCurrentEpisode(ep);
            renderEpisodeChain(items);
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
          episodeChainList.appendChild(btn);
        }
      }

      async function init() {
        updateHeader();
        if (imageUrlFromQuery) showPoster(imageUrlFromQuery, currentEpisode.title);

        try {
          const payload = await fetch("/api/episodes").then((r) => r.json());
          const list = Array.isArray(payload.episodes) ? payload.episodes : [];
          const found = findEpisodeWithChain(list, currentEpisode.episodeUrl);
          if (found.episode) {
            setCurrentEpisode(found.episode, { pushState: false });
          } else {
            renderProviders();
          }
          renderEpisodeChain(found.chain);
        } catch {
          renderProviders();
        }
      }

      window.addEventListener("popstate", () => {
        window.location.reload();
      });

      init();
    </script>
  </body>
</html>
