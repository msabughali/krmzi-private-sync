services:
  web:
    build:
      context: .
    image: krmzi-private-sync:latest
    container_name: krmzi-web
    restart: unless-stopped
    # Coolify injects env vars from the dashboard at runtime.
    # env_file is only used for local `docker compose up`.
    env_file:
      - path: .env
        required: false
    environment:
      WEB_PORT: 8787
      MAX_EPISODES_PER_RUN: 1000
      MAX_LIST_PAGES: 80
      EPISODES_FILE_PATH: /app/data/episodes.json
      SERIES_FILE_PATH: /app/data/series.json
      STATE_FILE_PATH: /app/data/state.json
      SEED_DATA_MODE: missing
    expose:
      - "8787"
    ports:
      - "8787:8787"
    volumes:
      - krmzi-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: ["node", "src/webServer.js"]

  worker:
    build:
      context: .
    image: krmzi-private-sync:latest
    container_name: krmzi-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MAX_EPISODES_PER_RUN: 1000
      MAX_LIST_PAGES: 80
      EPISODES_FILE_PATH: /app/data/episodes.json
      SERIES_FILE_PATH: /app/data/series.json
      STATE_FILE_PATH: /app/data/state.json
      SEED_DATA_MODE: missing
    volumes:
      - krmzi-data:/app/data
    depends_on:
      - web
    command: ["node", "src/index.js", "--loop"]

volumes:
  krmzi-data:
